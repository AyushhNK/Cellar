[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cellar"
version = "0.1.0"
description = "A local, encrypted password vault for Linux and Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "cryptography>=42"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.gui-scripts]
cellar = "cellar.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
